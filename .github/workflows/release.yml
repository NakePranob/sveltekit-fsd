name: release

on:
  # A merge into main is the release input. The workflow creates the matching
  # annotated tag after the release gates pass, then publishes from that tag.
  push:
    branches: [main]
  # Lets a failed publish be retried without inventing another commit or tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.1.0"
        required: false
        type: string

concurrency:
  group: release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      # contents: write to create the release tag and GitHub Release; id-token:
      # write for the OIDC token npm Trusted Publishing and --provenance use.
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
          # Unshallow, because the release check reads tag objects and compares
          # them against HEAD.
          fetch-depth: 0

      - name: Restrict automatic releases to main
        if: inputs.tag == '' && github.ref != 'refs/heads/main'
        run: |
          echo "automatic releases must run from main; provide an existing tag to retry a release"
          exit 1

      - uses: actions/setup-node@v5
        with:
          # 24, like the integration job in ci.yml and for the same reason: this
          # job runs `test:integration`, which generates a real SvelteKit app,
          # and npm 10 — which Node 22 ships — cannot install the dependency
          # graph `sv create` produces. The release would die before publishing.
          node-version: 24
          # registry-url is deliberately absent. It makes setup-node write an
          # .npmrc holding the literal placeholder XXXXX-XXXXX-XXXXX-XXXXX, and
          # npm then authenticates with that junk instead of exchanging the
          # OIDC token, which the registry rejects as a 404.
          # npm recommends publishing without a dependency cache.

      - run: npm ci

      - id: release
        name: Resolve release tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$REQUESTED_TAG" ]; then
            RELEASE_TAG="$REQUESTED_TAG"
          else
            RELEASE_TAG="v$VERSION"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # The same gates CI runs are repeated here for the exact commit that will
      # receive the release tag. A failed gate leaves main and the registry
      # release tag and registry untouched, so the run can be retried safely.
      - run: npm run verify
      - run: npm run test:integration

      - name: Create or reuse the annotated release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node -e 'const tag = process.env.RELEASE_TAG; if (!/^v(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)(?:-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$/.test(tag)) { console.error(`invalid release tag: ${tag}`); process.exit(1); }'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "$RELEASE_TAG already exists; release:check will verify it"
          else
            git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Check the tag against package.json
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm run release:check -- "$RELEASE_TAG"

      # Trusted Publishing exchanges the OIDC token for a short-lived
      # registry credential, and that only exists in npm 11.5.1 and later.
      # Node 22 still ships npm 10.x, which fails with ENEEDAUTH.
      - run: npm install -g npm@latest && npm --version

      # Skipped rather than attempted when the version is already up, for the
      # same reason the GitHub Release below is: `workflow_dispatch` exists so a
      # publish that half-succeeded can be re-run, and npm refuses to replace a
      # version that exists — so without this, every retry dies at the one step
      # that already worked and never reaches the steps that did not.
      #
      # It is also what makes the first release survivable. A package that does
      # not exist yet cannot have a trusted publisher configured (npm needs the
      # package to exist before it will show you its settings), so 0.1.0 has to
      # be pushed from a machine, and the tag then fires this workflow over a
      # version that is already there.
      - name: Publish from the verified tag
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on the registry — nothing to publish"
          else
            npm publish --provenance --access public
          fi

      - name: Create the GitHub Release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
