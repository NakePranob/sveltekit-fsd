name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast and offline: tsc, the patcher unit tests, and the smoke test — which
  # drives the real binary against a hand-built fixture and runs steiger over
  # the result using this repo's own node_modules.
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because every path this CLI writes is built
        # by hand: route files use posix joins, the routes directory is
        # interpolated into ESLint globs and steiger `ignores`, and
        # findRouteFor splits on path.sep. A glob with a backslash in it
        # matches nothing, and the filesystem hides that — so the rule quietly
        # stops applying rather than failing. None of it is exercised by
        # developing on macOS. writeAgentSkill's symlink fallback is here too.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  # Slow and networked: a real `sv create`, a real install, and a real
  # `svelte-check` / `eslint` / `vite build` over the generated tree. Catches
  # what the smoke test structurally cannot — a dependency range that does not
  # resolve, generated code that does not type-check against the real Svelte and
  # TanStack Query, and a SvelteKit release that changes behaviour under us.
  # One OS is enough; this is about the toolchain, not paths.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 24, not 22, and for the app this job generates rather than for the
          # CLI. Node 22 ships npm 10, and npm 10's arborist cannot resolve the
          # dependency graph a current `sv create` produces with its add-ons —
          # it dies with "Cannot read properties of null (reading 'edgesOut')"
          # on an untouched scaffold, before this CLI has touched anything.
          # Node 24 ships npm 11, which installs it. The `verify` job stays on
          # 22 because that is where the CLI's own `engines` are tested.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
